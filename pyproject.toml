[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "evennia-survival"
version = "0.0.1"
description = "Hunger, thirst and regeneration meters for Evennia characters."
readme = "README.md"
license = {text = "BSD-3-Clause"}
authors = [{name = "Tim Baird"}]
requires-python = ">=3.10"
keywords = ["evennia", "mud", "survival", "hunger", "thirst", "regeneration"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Multi-User Dungeons (MUD)",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "evennia",
]

[project.urls]
Homepage = "https://github.com/FullCircleMUD/evennia-survival"
Repository = "https://github.com/FullCircleMUD/evennia-survival"
Issues = "https://github.com/FullCircleMUD/evennia-survival/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["evennia_survival*"]
